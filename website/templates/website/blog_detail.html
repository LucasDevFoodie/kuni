{% extends "website/base.html" %}

{% block title %}{{ blog.title }}{% endblock %}

{% block content %}

<section class="detail-hero"
         style="background-image: url('{{ blog.image.url }}')">

    <h1>
        {{ blog.title }}
    </h1>

</section>

<section class="detail-content">

    <h2>
        {{ blog.subtitle }}
    </h2>

    <p>
        {{ blog.description }}
    </p>

    {% if blog.package and blog.package.is_available %}

        <a href="{% url 'package-detail' blog.package.slug %}">
            {% trans "View Related Package" %}
        </a>

    {% endif %}

</section>

{% endblock %}
